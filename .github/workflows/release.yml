name: Release

# Tags and publishes the version in VERSION once, after the checks pass, with a
# Linux and a Windows archive of each configuration attached. Pushes that don't
# change the version find the tag already there, and build nothing.
#
# To release: Actions -> Prepare Release -> Run workflow, then merge its PR.
on:
  push:
    branches: [main]

permissions: {}

jobs:
  pending:
    name: Pending
    uses: NearlyTRex/Workflows/.github/workflows/release-check.yml@9e1d569f0f334c38fc2f24cc45a9428b86afb623 # v0.2.20
    permissions:
      contents: read
    with:
      version-file: VERSION

  check:
    name: Check
    needs: pending
    if: needs.pending.outputs.pending == 'true'
    uses: NearlyTRex/Workflows/.github/workflows/lint.yml@9e1d569f0f334c38fc2f24cc45a9428b86afb623 # v0.2.20
    permissions:
      contents: read

  package:
    name: Package (${{ matrix.platform }}, ${{ matrix.mode }})
    needs: pending
    if: needs.pending.outputs.pending == 'true'
    uses: NearlyTRex/Workflows/.github/workflows/cpp-build.yml@9e1d569f0f334c38fc2f24cc45a9428b86afb623 # v0.2.20
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        mode: [debug, release]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    with:
      runs-on: ${{ matrix.os }}
      submodules: "true"
      # The version built in comes from git describe, so it needs the history and the tag.
      fetch-depth: 0
      local-tag: ${{ needs.pending.outputs.tag }}
      apt-packages: ninja-build binutils-dev libdw-dev libgtk-3-dev libwebkit2gtk-4.1-dev
      ccache: ${{ matrix.os == 'ubuntu-latest' }}
      build-command: |
        cmake --workflow --preset ${{ matrix.platform }}-${{ matrix.mode }}
        7z a Fyleria_${{ matrix.platform }}_x86_64_${{ matrix.mode }}.7z ./Data ./Bin
      artifact: fyleria-${{ matrix.platform }}-${{ matrix.mode }}
      artifact-path: Fyleria_${{ matrix.platform }}_x86_64_${{ matrix.mode }}.7z

  # Signs build provenance for the archives, so a download can be checked with
  # gh attestation verify.
  attest:
    name: Attest
    needs: [package]
    uses: NearlyTRex/Workflows/.github/workflows/attest.yml@9e1d569f0f334c38fc2f24cc45a9428b86afb623 # v0.2.20
    permissions:
      id-token: write
      attestations: write
    with:
      artifacts: fyleria-*

  release:
    name: Release
    needs: [check, attest, package]
    uses: NearlyTRex/Workflows/.github/workflows/release.yml@9e1d569f0f334c38fc2f24cc45a9428b86afb623 # v0.2.20
    permissions:
      contents: write
    with:
      version-file: VERSION
      assets: fyleria-*
      checksums: true
