name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # Only pull requests: a newer push supersedes their run. On main every run
  # finishes, since each push's secret scan covers only that push's commits.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    uses: NearlyTRex/Workflows/.github/workflows/lint.yml@4a7f6e3f7dbda5bbe67fd2f25d6f03373ea5f811 # v0.2.25
    permissions:
      contents: read

  build:
    name: Build (${{ matrix.platform }}, ${{ matrix.mode }})
    uses: NearlyTRex/Workflows/.github/workflows/cpp-build.yml@4a7f6e3f7dbda5bbe67fd2f25d6f03373ea5f811 # v0.2.25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        mode: [debug, release]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    with:
      runs-on: ${{ matrix.os }}
      submodules: "true"
      # Skipped on Windows by the library.
      apt-packages: ninja-build binutils-dev libdw-dev libgtk-3-dev libwebkit2gtk-4.1-dev
      ccache: ${{ matrix.os == 'ubuntu-latest' }}
      # Configures, builds and runs the tests.
      build-command: cmake --workflow --preset ${{ matrix.platform }}-${{ matrix.mode }}
      artifact: Fyleria-${{ matrix.platform }}-x86_64-${{ matrix.mode }}
      artifact-path: |
        Bin/FyleriaMain_${{ matrix.platform }}_x86_64_${{ matrix.mode }}*
        Bin/FyleriaTest_${{ matrix.platform }}_x86_64_${{ matrix.mode }}*
